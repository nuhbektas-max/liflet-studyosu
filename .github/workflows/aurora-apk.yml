# AURORA AI Android uygulamasını (APK) derler, "aurora-apk-latest" git etiketine ve GitHub Releases'a koyar.
name: AURORA APK

on:
  push:
    branches: [main, claude/aurora-ai-android-robot-z39ta7]
    paths:
      - 'aurora-ai/app/**'
      - '.github/workflows/aurora-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Çekirdek testleri (durum makinesi, dudak senkronu, araçlar, Claude döngüsü)
        run: node --test aurora-ai/app/test/*.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        env:
          IMZA_ANAHTAR: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          IMZA_PAROLA: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          extra=""
          if [ -n "$IMZA_ANAHTAR" ] && [ -n "$IMZA_PAROLA" ]; then
            echo "$IMZA_ANAHTAR" | base64 -d > "$RUNNER_TEMP/imza.keystore"
            extra="-PimzaDosya=$RUNNER_TEMP/imza.keystore -PimzaParola=$IMZA_PAROLA -PimzaAd=bektas"
            echo "Sabit imza anahtari kullaniliyor."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS tanimli degil; APK gecici anahtarla imzalaniyor."
          fi
          gradle -p aurora-ai/app/android assembleDebug --no-daemon $extra
          cp aurora-ai/app/android/app/build/outputs/apk/debug/app-debug.apk AuroraAI-1.2.apk
          ls -la AuroraAI-1.2.apk

      - name: APK'yı git etiketine koy
        run: |
          d=$(mktemp -d)
          cp AuroraAI-1.2.apk "$d/"
          cd "$d"
          git init -q
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "AURORA APK (derleme ${{ github.run_number }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/tags/aurora-apk-latest

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraAI-apk
          path: AuroraAI-1.2.apk

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-v1.2-${{ github.run_number }}
          name: AURORA AI 1.2 (derleme ${{ github.run_number }})
          body: |
            Telefona kurmak için AuroraAI-1.2.apk dosyasını indirip açın. Android "bilinmeyen kaynaklardan yükleme" izni isterse izin verin.
            İlk açılışta sağ üstteki ayarlardan sağlayıcıyı (Gemini ya da Claude) seçip API anahtarını girin, mikrofona dokunup konuşun.
          target_commitish: ${{ github.sha }}
          files: AuroraAI-1.2.apk
