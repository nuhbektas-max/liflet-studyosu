# İlaç Takip Android uygulamasını (APK) derler ve GitHub "Releases" sayfasına koyar.
name: İlaç Takip APK

on:
  push:
    paths:
      - 'ilac-takip/**'
      - '.github/workflows/ilac-takip-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hesap kuralı testleri
        run: node ilac-takip/test/model.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        env:
          IMZA_ANAHTAR: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          IMZA_PAROLA: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          extra=""
          if [ -n "$IMZA_ANAHTAR" ] && [ -n "$IMZA_PAROLA" ]; then
            echo "$IMZA_ANAHTAR" | base64 -d > "$RUNNER_TEMP/imza.keystore"
            extra="-PimzaDosya=$RUNNER_TEMP/imza.keystore -PimzaParola=$IMZA_PAROLA -PimzaAd=bektas"
            echo "Sabit imza anahtari kullaniliyor."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS tanimli degil; APK gecici anahtarla imzalaniyor (guncelleme eski surumun uzerine kurulmayabilir)."
          fi
          gradle -p ilac-takip/android assembleDebug lintDebug --no-daemon $extra

      - name: Lint sonuçları
        run: |
          r=ilac-takip/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          grep -E "(Error|Warning):" "$r" || true
          if grep -q "Error:" "$r"; then echo "::error::Lint hata buldu"; exit 1; fi

      - name: APK'yı adlandır ve içeriğini denetle
        run: |
          cp ilac-takip/android/app/build/outputs/apk/debug/app-debug.apk IlacTakip-2.9.apk
          unzip -l IlacTakip-2.9.apk | grep -E "assets/(index.html|app.js|model.js)|AndroidManifest.xml"
          test "$(unzip -l IlacTakip-2.9.apk | grep -cE 'assets/(index.html|app.js|model.js|app.css)')" = 4

      # Rapor yüklenemezse (depolama kotası dolu) derleme durmasın; lint sonuçları yukarıda günlükte.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 3
          name: lint-raporu
          path: ilac-takip/android/app/build/reports/lint-results-debug.*

      # Son APK'yı "ilac-takip-apk-latest" git etiketinde de sakla (hiçbir dala dokunmaz).
      - name: APK'yı git etiketine koy
        run: |
          d=$(mktemp -d)
          cp IlacTakip-2.9.apk "$d/"
          cd "$d"
          git init -q
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "İlaç Takip APK (derleme ${{ github.run_number }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/tags/ilac-takip-apk-latest

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ilac-takip-v2.9-${{ github.run_number }}
          name: İlaç Takip 2.9 (derleme ${{ github.run_number }})
          body: |
            Telefona kurmak için IlacTakip-2.9.apk dosyasını indirip açın.
            Android "bilinmeyen kaynaklardan uygulama yükleme" izni isterse izin verin.
            İlk açılışta bildirim iznini verin, sonra Ayarlar > Alarm kontrolü ekranındaki eksikleri "Düzelt" ile tamamlayın.
            Eski "İlaç ve İğne Takip" uygulamasındaki ilaçları taşımak için eski uygulamada yedeği panoya kopyalayıp yeni uygulamada Ayarlar > Yedek metnini yapıştır'ı kullanın.
          target_commitish: ${{ github.sha }}
          files: IlacTakip-2.9.apk
