# Süt Rasyon Android uygulamasını (APK) ve Windows kurulum dosyasını (.exe) derler, GitHub "Releases" sayfasına koyar.
name: Süt Rasyon APK ve Windows

on:
  push:
    branches: [main]
    paths:
      - 'sut-rasyon/**'
      - '.github/workflows/sut-rasyon-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hesap motoru testleri
        run: node sut-rasyon/test/model.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        env:
          IMZA_ANAHTAR: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          IMZA_PAROLA: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          extra=""
          if [ -n "$IMZA_ANAHTAR" ] && [ -n "$IMZA_PAROLA" ]; then
            echo "$IMZA_ANAHTAR" | base64 -d > "$RUNNER_TEMP/imza.keystore"
            extra="-PimzaDosya=$RUNNER_TEMP/imza.keystore -PimzaParola=$IMZA_PAROLA -PimzaAd=bektas"
            echo "Sabit imza anahtari kullaniliyor."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS tanimli degil; APK gecici anahtarla imzalaniyor (guncelleme eski surumun uzerine kurulmayabilir)."
          fi
          gradle -p sut-rasyon/android assembleDebug --no-daemon $extra

      - name: APK'yı adlandır
        run: |
          cp sut-rasyon/android/app/build/outputs/apk/kullanici/debug/app-kullanici-debug.apk SutRasyon-1.2.apk
          cp sut-rasyon/android/app/build/outputs/apk/yonetici/debug/app-yonetici-debug.apk SutRasyon-Yonetici-1.2.apk

      # Son APK'yı "sut-rasyon-apk-latest" git etiketinde de sakla (hiçbir dala dokunmaz).
      - name: APK'yı git etiketine koy
        run: |
          d=$(mktemp -d)
          cp SutRasyon-1.2.apk SutRasyon-Yonetici-1.2.apk "$d/"
          cd "$d"
          git init -q
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Süt Rasyon APK (derleme ${{ github.run_number }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/tags/sut-rasyon-apk-latest

      - uses: actions/upload-artifact@v4
        with:
          name: SutRasyon-apk
          path: |
            SutRasyon-1.2.apk
            SutRasyon-Yonetici-1.2.apk

  # Windows kurulum dosyası (.exe): aynı www/ dosyalarını Electron ile paketler.
  windows:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        working-directory: sut-rasyon/windows
        run: npm ci

      # Uygulamayı gerçekten açar: lisans kilidi görünür, rasyon hesaplanır, sonuç tablosu çıkar, PDF raporu üretilir.
      - name: Uygulama sınaması
        working-directory: sut-rasyon/windows
        shell: bash
        run: |
          node hazirla.js
          timeout 180 npx electron . --smoke-test || true
          cat smoke-result.json
          node -e "
            const r = require('./smoke-result.json');
            const ok = r.masaustu && r.kilit && r.tablo && !r.hata && r.pdfBayt > 10000 && r.pdfBaslik === '%PDF-' && /TL/.test(r.maliyet);
            if (!ok) { console.error('Sınama başarısız'); process.exit(1); }
            console.log('Sınama geçti:', r.maliyet, 'PDF', r.pdfBayt, 'bayt');"

      - name: Kurulum dosyasını derle
        working-directory: sut-rasyon/windows
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Kurulum dosyasını git etiketine koy
        continue-on-error: true
        shell: bash
        run: |
          d=$(mktemp -d)
          cp sut-rasyon/windows/dist/SutRasyon-Kurulum-*.exe "$d/"
          cd "$d"
          git init -q
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Süt Rasyon Windows (derleme ${{ github.run_number }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/tags/sut-rasyon-exe-latest

      - uses: actions/upload-artifact@v4
        with:
          name: SutRasyon-windows
          path: |
            sut-rasyon/windows/dist/SutRasyon-Kurulum-*.exe
            sut-rasyon/windows/dist/SutRasyon-Tasinabilir-*.exe

  # Sürümler değiştirilemez (immutable) olduğu için APK ve exe tek seferde yayınlanır.
  release:
    runs-on: ubuntu-latest
    needs: [build, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - run: ls -la art
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sut-rasyon-v1.2-${{ github.run_number }}
          name: Süt Rasyon 1.2 (derleme ${{ github.run_number }})
          body: |
            Telefona kurmak için SutRasyon-1.2.apk dosyasını indirip açın (kullanıcılar için; lisans ister).
            SutRasyon-Yonetici-1.2.apk yalnızca lisans veren yönetici içindir; ayrı bir uygulama olarak kurulur ve yönetici şifresiyle açılır.
            Android "bilinmeyen kaynaklardan uygulama yükleme" izni isterse izin verin.
            Windows bilgisayara kurmak için SutRasyon-Kurulum-1.2.0.exe dosyasını indirip çalıştırın. Kurmadan kullanmak için SutRasyon-Tasinabilir-1.2.0.exe (USB bellekte de çalışır).
            Windows "bilgisayarınızı korudu" uyarısı gösterirse "Ek bilgi" ve "Yine de çalıştır" seçin (dosya imzasızdır).
          target_commitish: ${{ github.sha }}
          files: art/*
