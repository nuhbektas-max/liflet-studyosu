plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bektas.aurora'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bektas.aurora'
        minSdk 29          // Android 10: Wi-Fi paneli (Settings.Panel) bu sürümden beri var
        targetSdk 34
        versionCode 3
        versionName '1.2'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    // Ekran, yüz ve Claude bağlantısı web dosyalarıdır (aurora-ai/app/www); tarayıcı sürümüyle aynı.
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }

    // Sabit imza: GitHub Secrets'taki anahtar verilirse (-PimzaDosya=...) her derleme aynı anahtarla
    // imzalanır; böylece güncellemeler eski sürümün üzerine kurulur. Anahtar depoda tutulmaz.
    if (project.hasProperty('imzaDosya')) {
        signingConfigs {
            sabit {
                storeFile file(project.property('imzaDosya'))
                storePassword project.property('imzaParola')
                keyAlias project.property('imzaAd')
                keyPassword project.property('imzaParola')
            }
        }
    }

    buildTypes {
        debug {
            if (project.hasProperty('imzaDosya')) signingConfig signingConfigs.sabit
        }
        release {
            minifyEnabled false
            if (project.hasProperty('imzaDosya')) signingConfig signingConfigs.sabit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader: sayfayı https://appassets.androidplatform.net adresinden sunar
    // (ES modülleri file:// adresinden yüklenmez).
    implementation 'androidx.webkit:webkit:1.11.0'
}
