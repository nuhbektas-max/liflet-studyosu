plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bektas.sutrasyon'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bektas.sutrasyon'
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName '1.2'
    }

    // Uygulamanın ekranı, web ve Windows sürümüyle aynı dosyalardır (sut-rasyon/www).
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }

    // İki uygulama: standart kullanıcı ve yönetici. Yönetici uygulaması ayrı kurulur (farklı paket adı),
    // adı "Süt Rasyon Yönetici"dir ve www/rol.js yerine src/yonetici/assets/rol.js'i kullanır.
    flavorDimensions 'rol'
    productFlavors {
        kullanici {
            dimension 'rol'
        }
        yonetici {
            dimension 'rol'
            applicationIdSuffix '.yonetici'
        }
    }

    // Sabit imza: GitHub Secrets'taki anahtar verilirse (-PimzaDosya=...) her derleme aynı anahtarla
    // imzalanır; böylece güncellemeler eski sürümün üzerine kurulabilir. Anahtar depoda tutulmaz.
    if (project.hasProperty('imzaDosya')) {
        signingConfigs {
            sabit {
                storeFile file(project.property('imzaDosya'))
                storePassword project.property('imzaParola')
                keyAlias project.property('imzaAd')
                keyPassword project.property('imzaParola')
            }
        }
    }

    buildTypes {
        debug {
            if (project.hasProperty('imzaDosya')) signingConfig signingConfigs.sabit
        }
        release {
            minifyEnabled false
            if (project.hasProperty('imzaDosya')) signingConfig signingConfigs.sabit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider: PDF raporunu WhatsApp ve e-posta gibi uygulamalarla paylaşmak için.
    implementation 'androidx.core:core:1.12.0'
}
